[package]
name = "asset-lint"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zerocukor287/asset-lint"
homepage = "https://github.com/zerocukor287/asset-lint"
documentation = "https://docs.rs/asset-lint"
description = "CLI tool to find common problems with assets during game development"
readme = "Readme.md"
categories = ["command-line-utilities", "game-development"]
keywords = ["gamedev", "assets", "linter"]

[dependencies]
clap_derive = "4.6"
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
walkdir = "2.5"
blake3 = "1.8"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
serde-sarif = "0.8"
strum_macros = "0.28"
human_bytes = "0.4"

[dev-dependencies]
assert_cmd = "2"